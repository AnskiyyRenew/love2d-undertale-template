# SoulEngine - LÖVE runtime setup configuration
#
# KEY=VALUE, one per line. '#' starts a comment. Values may be quoted.
# Used by install.bat (Windows) and install.sh (Linux / macOS).
#
# The defaults below point at love2d/love's official CI build for the main
# branch -- that is the only place a 12.0 build currently exists (12.0 has no
# tagged release yet). Each artifact zip may wrap another zip; both installers
# unwrap that automatically, so any official/packaged build works as a source.
#
# To pin a specific build, replace the SECOND "main" with a commit hash:
#   .../workflows/main/<commit-sha>/love-windows-x64.zip
# To use a stable release instead, drop in its release URL:
#   https://github.com/love2d/love/releases/download/11.5/love-11.5-win64.zip

LOVE_WINDOWS_X64=https://nightly.link/love2d/love/workflows/main/main/love-windows-x64.zip
LOVE_WINDOWS_ARM64=https://nightly.link/love2d/love/workflows/main/main/love-windows-arm64.zip
LOVE_LINUX_X64=https://nightly.link/love2d/love/workflows/main/main/love-linux-X64.AppImage.zip
LOVE_LINUX_ARM64=https://nightly.link/love2d/love/workflows/main/main/love-linux-ARM64.AppImage.zip
LOVE_MACOS=https://nightly.link/love2d/love/workflows/main/main/love-macos.zip

# Where the runtime is unpacked. Relative paths are resolved against Packager/.
# tools/love keeps everything inside the repo, so deleting the folder uninstalls.
DEST=tools/love

# Download cache. Same relative-path rule. Archives are deleted after a
# successful install unless KEEP_ARCHIVE=1. Kept under tools/ so that a single
# "delete Packager/tools" removes the runtime and the cache together.
CACHE=tools/cache
KEEP_ARCHIVE=0
